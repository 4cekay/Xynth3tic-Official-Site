<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xynth3tic Official</title>

    <link href="../css/flexbox.css" rel="stylesheet" />
    <link href="../../css/fonts.css" rel="stylesheet" />

    <link href="../../css/global.css" rel="stylesheet" />
    <link href="../../css/item-details.css" rel="stylesheet" />
  </head>

  <body>
    <div class="home-cover">
      <img class="bg-overlay" src="../../images/bg.png" alt="red bg" />
      <img
        class="bg-img"
        src="../../images/fire-house.png"
        alt="Xynth3tic Band Cover"
      />
    </div>
    <header class="flexbox">
      <nav class="nav-main flexbox">
        <a href="../../index.html"
          ><img class="logo-img" src="../../images/logo.png" alt="Home"
        /></a>
        <ul class="nav-links-list">
          <li>
            <a class="checkout-link" href="./webstore.html">Back to Shop</a>
          </li>
          <li>
            <a class="nav-link" href="./cart.html#cart">Review Cart</a>
          </li>
          <li>
            <a class="nav-link" href="./checkout.html#payment">Payment</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="page-content">
      <div class="item-container" id="product-content" hidden>
        <div id="item-image"></div>

        <div class="item-column">
          <h1 class="item-name" id="product-name"></h1>

          <ul class="item-tags" id="product-tags">
            <li class="tag" id="product-type"></li>
            <li class="tag" id="divider-1">|</li>
            <li class="tag" id="product-lim" hidden>Limited</li>
            <li class="tag" id="divider-2">|</li>
            <li class="tag" id="product-signed" hidden>Signed</li>
          </ul>

          <div class="item-desc" id="product-desc">
            <p id="product-desc-text"></p>
            <p class="item-price" id="product-price"></p>
          </div>
          <button class="add-to-cart-button" onclick="cartAlert()">
            Add to Cart
          </button>
        </div>
      </div>
    </div>

    <footer class="flexbox">
      <p class="footer-text">© 2026 Xynth3tic Band. All Rights Reserved.</p>
      <p class="footer-links-list">
        <span
          ><a class="footer-link" href="/style_guide/index.html"
            >Style Guide</a
          ></span
        >
        |
        <span
          ><a class="footer-link" href="../citations.html">Citations</a></span
        >
      </p>
    </footer>

    <script>
      function cartAlert() {
        alert("Added to cart!");
      }
    </script>
    <script src="../../js/webstore.js"></script>
  </body>
</html>
