<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xynth3tic Official</title>

    <link href="../css/flexbox.css" rel="stylesheet" />
    <link href="../../css/global.css" rel="stylesheet" />
    <link href="../../css/fonts.css" rel="stylesheet" />
    <link href="../../css/checkout.css" rel="stylesheet" />
  </head>

  <body>
    <div class="home-cover">
      <img class="bg-overlay" src="../../images/bg.png" alt="red bg" />
      <img
        class="bg-img"
        src="../../images/fire-house.png"
        alt="Xynth3tic Band Cover"
      />
    </div>
    <header class="flexbox">
      <nav class="nav-main flexbox">
        <a href="../../index.html"
          ><img class="logo-img" src="../../images/logo.png" alt="Home"
        /></a>
        <ul class="nav-links-list">
          <li>
            <a class="checkout-link" href="./webstore.html">Back to Shop</a>
          </li>
          <li><a class="nav-link" href="./cart.html">Review Cart</a></li>
          <li><a class="nav-link" href="#">Checkout</a></li>
        </ul>
      </nav>
    </header>

    <div id="main-content">
      <!-- // PAYMENT SECTION -->
      <section id="payment">
        <h2 class="element-heading">Payment & Shipping</h2>
        <div class="rendered-display">
          <form class="payment-form">
            <div class="input-row">
              <section id="payment-methods">
                <div class="checkout-field">
                  <p class="input-title">Payment Method:</p>
                  <label class="radio-label">
                    <input
                      class="radio-button"
                      type="radio"
                      name="payment-method"
                      value="Credit/Debit"
                      checked
                    />
                    Credit/Debit
                  </label>

                  <label class="radio-label">
                    <input
                      class="radio-button"
                      type="radio"
                      name="payment-method"
                      value="PayPal"
                    />
                    PayPal
                  </label>

                  <label>
                    <input
                      class="radio-button"
                      type="radio"
                      name="payment-method"
                      value="Gift Card"
                    />
                    Gift Card
                  </label>
                </div>

                <div class="checkout-field">
                  <label class="input-label" for="card-number"
                    >Card Number:
                  </label>
                  <input
                    id="card-number"
                    class="input-field"
                    type="text"
                    placeholder="1234-5678-9101-1213"
                    required
                  />

                  <label class="input-label" for="card-exp"
                    >Expiry Date:
                  </label>
                  <input
                    id="card-exp"
                    class="input-field"
                    type="text"
                    placeholder="MM/YY"
                    required
                  />

                  <label class="input-label" for="card-cvc"
                    >Security Code:
                  </label>
                  <input
                    id="card-cvc"
                    class="input-field"
                    type="text"
                    placeholder="CVC"
                    required
                  />
                </div>
              </section>

              <section id="billing">
                <p class="input-title">Billing Address:</p>

                <div class="name-row">
                  <label class="input-label" for="first-name"
                    >First Name:
                  </label>
                  <input
                    id="first-name"
                    class="input-field"
                    type="text"
                    placeholder="Jane"
                    required
                  />
                  <label class="input-label" for="last-name">Last Name: </label>
                  <input
                    id="last-name"
                    class="input-field"
                    type="text"
                    placeholder="Doe"
                    required
                  />
                </div>

                <div class="address-column">
                  <label class="input-label" for="ad-line-1"
                    >Address Line 1:
                  </label>
                  <input
                    id="ad-line-1"
                    class="input-field"
                    type="text"
                    placeholder="House no. and street"
                    required
                  />
                  <label class="input-label" for="ad-line-2"
                    >Address Line 2 (Optional):
                  </label>
                  <input
                    id="ad-line-2"
                    class="input-field"
                    type="text"
                    placeholder="Apartment, unit, suite, etc."
                  />
                </div>

                <div class="address-column">
                  <label class="input-label" for="city">Town/City:</label>
                  <input id="city" class="input-field" type="text" required />
                  <label class="input-label" for="province"
                    >Province/State:
                  </label>
                  <input id="province" class="input-field" type="text" required />
                  <label class="input-label" for="zip">Postal Code: </label>
                  <input id="zip" class="input-field" type="text" required />
                </div>

                <div class="address-column">
                  <label class="input-label" for="email">Email Address: </label>
                  <input
                    id="email"
                    class="input-field"
                    type="text"
                    placeholder="e.g. you@email.com"
                    required
                  />
                </div>
              </section>
            </div>

            <button class="payment-button">Pay Now</button>
          </form>
        </div>
      </section>
    </div>

    <!-- PAYMENT SECTION // -->

    <footer class="flexbox">
      <p class="footer-text">2026 Xynth3tic Band</p>
      <p class="footer-links-list">
        <span
          ><a class="footer-link" href="/style_guide/index.html"
            >Style Guide</a
          ></span
        >
        | <span><a class="footer-link" href="#">Citations</a></span>
      </p>
    </footer>
  </body>
</html>
